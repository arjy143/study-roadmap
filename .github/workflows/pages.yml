name: Deploy site

# Deploys on site changes only — progress.json commits from ticking tasks don't trigger a rebuild.
on:
  push:
    branches: [main]
    paths-ignore:
      - "progress.json"
      - "README.md"
      - "tools/**"
      - ".github/scripts/**"
      - ".github/workflows/daily-reminder.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html app.js style.css plan.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
