name: Daily reminder

on:
  schedule:
    # GitHub's scheduler is best-effort (runs can be late or skipped), so try three times.
    # The script sends at most one reminder per day. UK times: BST = UTC+1, GMT = UTC.
    - cron: "41 4 * * *"   # 05:41 BST / 04:41 GMT
    - cron: "19 5 * * *"   # 06:19 BST / 05:19 GMT
    - cron: "53 5 * * *"   # 06:53 BST / 05:53 GMT
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD) for testing"
        required: false

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          FORCE_DATE: ${{ github.event.inputs.date }}
        with:
          script: |
            const run = require('./.github/scripts/daily.js');
            await run({ github, context, core });
